[package]
name = "qmk-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
hidapi = { version = "2.6", features = ["macos-shared-device"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hid-bridge = { path = "../shared/hid-bridge" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
chrono = "0.4.44"
chrono-tz = "0.10.4"
spa = "0.5.1"
serde_json = "1.0.149"
json5 = "1.3.1"
